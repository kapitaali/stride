# stride configuration
# RIDE-compatible gateway defaults (localhost:4502)

gateway_host = "127.0.0.1"
gateway_port = 4502
gateway_executable = "../rust-apl/target/debug/apl"
gateway_args = "--serve"
# Environment variables to set when spawning the gateway
gateway_env = []
apl_version = "GNU APL 2.0 (Rust)"
auto_connect = true
max_results = 500
