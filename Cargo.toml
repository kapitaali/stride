[package]
name = "stride"
version = "0.1.0"
edition = "2021"
description = "Terminal APL editor (TUI) with RIDE-compatible gateway to APL interpreters"

[[bin]]
name = "stride"
path = "src/main.rs"

[lib]
name = "stride"
path = "src/lib.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
